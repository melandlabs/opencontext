name: Feature request
description: Propose a new feature for opencontext
title: '[feature] '
labels: ['enhancement']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new capability for the runtime substrate.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem are you trying to solve?
      placeholder: |
        Today, callers have to remember() then recall() in two steps; it
        would be cleaner to expose a single ask() that internally orchestrates
        both, with optional context-graph expansion.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch of the API or behavior you want.
      placeholder: |
        ```ts
        const answer = await store.ask({
          query: "What did the user say about pizza last week?",
          expandGraph: true,
          topK: 10,
        });
        ```
      render: ts

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem and why you'd prefer yours.

  - type: dropdown
    id: surface
    attributes:
      label: Where does this change live?
      options:
        - New package
        - Existing package: memory-store
        - Existing package: rag
        - Existing package: integrations
        - Other (specify in description)
    validations:
      required: true