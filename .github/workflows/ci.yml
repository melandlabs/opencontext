name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  format:
    # biome's own format check. Runs ahead of lint so a formatting
    # regression fails before the (slower) lint / typecheck / test
    # jobs run on every OS.
    name: Format (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bump Node heap on macOS — @melandlabs/ai has ~70 tsup entries
      # (heavy deps: @ai-sdk/anthropic, ai@5, @vercel/sandbox,
      # @anthropic-ai/claude-agent-sdk) and the macOS runner's default
      # tsup child-worker heap OOMs on DTS generation. Linux passes
      # comfortably without it.
      - name: Build
        # Bump Node heap on macOS — @melandlabs/ai has ~70 tsup entries
        # (heavy deps: @ai-sdk/anthropic, ai@5, @vercel/sandbox,
        # @anthropic-ai/claude-agent-sdk) and the macOS runner's default
        # tsup child-worker heap OOMs on DTS generation. Linux passes
        # comfortably without it.
        # OKF ↔ memory-store form a workspace cycle, but the OKF →
        # memory-store direction is only a `devDependency` (the runtime
        # cycle is broken via a lazy `await import(...)` inside
        # `okf/src/cli.ts`). pnpm 10 therefore does not enforce a
        # topological edge from memory-store to okf, so `pnpm -r build`
        # starts the two tsup DTS steps in parallel and the OKF one
        # races the memory-store one — whichever resolves
        # `typeof import('@melandlabs/memory-store')` first crashes with
        # TS2307 because the other hasn't written its `dist/index.d.ts`
        # yet. Pure timing flake on a single `pnpm -r build` invocation.
        #
        # Two-pass build (mirrors release.yml's published-tarball build):
        # the first pass uses pnpm's `...` suffix to build OKF's
        # transitive dep closure (forcing memory-store ahead of OKF in
        # the topo order and seeding every consumer's `dist/*.d.ts`),
        # and the second pass rebuilds the full workspace against the
        # already-seeded types.
        run: |
          pnpm --filter @melandlabs/okf... build
          pnpm -r --filter './packages/**' build
        env:
          NODE_OPTIONS: ${{ matrix.os == 'macos-latest' && '--max-old-space-size=8192' || '' }}
      - run: pnpm -r typecheck

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # examples/ smoke-tests import @melandlabs/* packages and need dist/
      # artifacts to be present before `pnpm -r test` runs.
      # Bump Node heap on macOS — @melandlabs/ai's tsup DTS step OOMs
      # the default worker heap; see the matching note in the typecheck
      # job above.
      - name: Build
        # examples/ smoke-tests import @melandlabs/* packages and need dist/
        # artifacts to be present before `pnpm -r test` runs.
        # Bump Node heap on macOS — @melandlabs/ai's tsup DTS step OOMs
        # the default worker heap; see the matching note in the typecheck
        # job above.
        # OKF ↔ memory-store DTS race — see the typecheck job above for
        # the full explanation. Two-pass build mirrors release.yml: seed
        # OKF's transitive dep closure first, then rebuild the whole
        # workspace against the seeded `dist/*.d.ts`.
        run: |
          pnpm --filter @melandlabs/okf... build
          pnpm -r --filter './packages/**' build
        env:
          NODE_OPTIONS: ${{ matrix.os == 'macos-latest' && '--max-old-space-size=8192' || '' }}
      - run: pnpm -r test

  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate changeset
        run: |
          if [[ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -v config.json)" ]]; then
            if git diff --name-only origin/main...HEAD | grep -E '^packages/.*/src/' > /dev/null; then
              echo "::error::Source files changed but no changeset found. Run 'pnpm changeset'."
              exit 1
            fi
          fi

  smoke:
    # End-to-end verification of every @melandlabs/* package against the
    # npm registry. Runs `examples/` smoke tests; packages are installed
    # straight from npmjs.org so we catch publish-time issues
    # (missing exports, broken subpaths, etc.) before they ship.
    name: Smoke test published @melandlabs/* packages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install published packages
        working-directory: examples
        # `--ignore-workspace` drops the surrounding pnpm-workspace.yaml
        # context so pnpm actually pulls every @melandlabs/* from
        # npmjs.org instead of symlinking to the monorepo's source
        # trees (whose `dist/` doesn't exist on a fresh checkout).
        run: pnpm install --ignore-workspace --registry=https://registry.npmjs.org

      - name: Run smoke tests
        working-directory: examples
        run: pnpm test