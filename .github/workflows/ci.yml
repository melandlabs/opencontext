name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    # Fail-fast on stale pnpm-lock.yaml. Catches the "package.json bumped
    # but lockfile not regenerated" mistake at PR time rather than at
    # release time, where it broke the 0.6.0 release commit's CI on push
    # to main (`pnpm install --frozen-lockfile` failed with
    # `ERR_PNPM_OUTDATED_LOCKFILE`). Cheap: no install, no build, no test.
    name: pnpm-lock.yaml consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only
      - name: Diff pnpm-lock.yaml
        run: |
          if ! git diff --exit-code pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml is out of sync with package.json. Run \`pnpm install\` locally and commit the regenerated lockfile."
            git diff pnpm-lock.yaml | head -200
            exit 1
          fi

  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  format:
    # biome's own format check. Runs ahead of lint so a formatting
    # regression fails before the (slower) lint / typecheck / test
    # jobs run on every OS.
    name: Format (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bump Node heap on macOS — @melandlabs/ai has ~70 tsup entries
      # (heavy deps: @ai-sdk/anthropic, ai@5, @vercel/sandbox,
      # @anthropic-ai/claude-agent-sdk) and the macOS runner's default
      # tsup child-worker heap OOMs on DTS generation. Linux passes
      # comfortably without it.
      - name: Build
        # Bump Node heap on macOS — @melandlabs/ai has ~70 tsup entries
        # (heavy deps: @ai-sdk/anthropic, ai@5, @vercel/sandbox,
        # @anthropic-ai/claude-agent-sdk) and the macOS runner's default
        # tsup child-worker heap OOMs on DTS generation. Linux passes
        # comfortably without it.
        run: pnpm -r --filter './packages/**' build
        env:
          NODE_OPTIONS: ${{ matrix.os == 'macos-latest' && '--max-old-space-size=8192' || '' }}
      - run: pnpm -r typecheck

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # examples/ smoke-tests import @melandlabs/* packages and need dist/
      # artifacts to be present before `pnpm -r test` runs.
      # Bump Node heap on macOS — @melandlabs/ai's tsup DTS step OOMs
      # the default worker heap; see the matching note in the typecheck
      # job above.
      - name: Build
        # examples/ smoke-tests import @melandlabs/* packages and need dist/
        # artifacts to be present before `pnpm -r test` runs.
        # Bump Node heap on macOS — @melandlabs/ai's tsup DTS step OOMs
        # the default worker heap; see the matching note in the typecheck
        # job above.
        run: pnpm -r --filter './packages/**' build
        env:
          NODE_OPTIONS: ${{ matrix.os == 'macos-latest' && '--max-old-space-size=8192' || '' }}
      - run: pnpm -r test

  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate changeset
        run: |
          if [[ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -v config.json)" ]]; then
            if git diff --name-only origin/main...HEAD | grep -E '^packages/.*/src/' > /dev/null; then
              echo "::error::Source files changed but no changeset found. Run 'pnpm changeset'."
              exit 1
            fi
          fi

  smoke:
    # End-to-end verification of every @melandlabs/* package against the
    # npm registry. Runs `examples/` smoke tests; packages are installed
    # straight from npmjs.org so we catch publish-time issues
    # (missing exports, broken subpaths, etc.) before they ship.
    name: Smoke test published @melandlabs/* packages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install published packages
        working-directory: examples
        # `--ignore-workspace` drops the surrounding pnpm-workspace.yaml
        # context so pnpm actually pulls every @melandlabs/* from
        # npmjs.org instead of symlinking to the monorepo's source
        # trees (whose `dist/` doesn't exist on a fresh checkout).
        run: pnpm install --ignore-workspace --registry=https://registry.npmjs.org

      - name: Run smoke tests
        working-directory: examples
        run: pnpm test