name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  format:
    # biome's own format check. Runs ahead of lint so a formatting
    # regression fails before the (slower) lint / typecheck / test
    # jobs run on every OS.
    name: Format (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pre-seed OKF's dist via pnpm's `...` suffix so its transitive
      # dep closure (memory-store in particular) is built topologically
      # before the full serial `pnpm -r build` runs. Without this, the
      # OKF ↔ memory-store workspace cycle (memory-store → okf via
      # `dependencies`, okf → memory-store via `devDependencies`) lets
      # pnpm 10 schedule memory-store's tsup DTS before OKF has written
      # its d.ts, failing with TS2307 (`Cannot find module
      # '@melandlabs/memory-store'` from `packages/okf/src/cli.ts:24`).
      - run: pnpm --filter @melandlabs/okf... build
      - run: pnpm -r build
      - run: pnpm -r typecheck

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # examples/ smoke-tests import @melandlabs/* packages and need dist/
      # artifacts to be present before `pnpm -r test` runs.
      # Pre-seed OKF's dist via pnpm's `...` suffix so its transitive dep
      # closure (memory-store in particular) is built topologically before
      # the full serial `pnpm -r build` runs. Without this, the OKF ↔
      # memory-store workspace cycle (memory-store → okf via `dependencies`,
      # okf → memory-store via `devDependencies`) lets pnpm 10 schedule
      # memory-store's tsup DTS before OKF has written its d.ts, failing
      # with TS2307 (`Cannot find module '@melandlabs/memory-store'`).
      - run: pnpm --filter @melandlabs/okf... build
      - run: pnpm -r build
      - run: pnpm -r test

  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pre-seed OKF's dist via pnpm's `...` suffix so its transitive dep
      # closure (memory-store in particular) is built topologically before
      # the full serial `pnpm -r build` runs. Without this, the OKF ↔
      # memory-store workspace cycle lets pnpm 10 schedule memory-store's
      # tsup DTS before OKF has written its d.ts, failing with TS2307.
      - run: pnpm --filter @melandlabs/okf... build
      - run: pnpm -r build

  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate changeset
        run: |
          if [[ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -v config.json)" ]]; then
            if git diff --name-only origin/main...HEAD | grep -E '^packages/.*/src/' > /dev/null; then
              echo "::error::Source files changed but no changeset found. Run 'pnpm changeset'."
              exit 1
            fi
          fi

  smoke:
    # End-to-end verification of every @melandlabs/* package against the
    # npm registry. Runs `examples/` smoke tests; packages are installed
    # straight from npmjs.org so we catch publish-time issues
    # (missing exports, broken subpaths, etc.) before they ship.
    name: Smoke test published @melandlabs/* packages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install published packages
        working-directory: examples
        # `--ignore-workspace` drops the surrounding pnpm-workspace.yaml
        # context so pnpm actually pulls every @melandlabs/* from
        # npmjs.org instead of symlinking to the monorepo's source
        # trees (whose `dist/` doesn't exist on a fresh checkout).
        run: pnpm install --ignore-workspace --registry=https://registry.npmjs.org

      - name: Run smoke tests
        working-directory: examples
        run: pnpm test