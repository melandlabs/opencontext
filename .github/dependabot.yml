version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    groups:
      opencontext-major:
        update-types:
          - "major"
        labels:
          - "dependencies"
          - "breaking"
      opencontext-minor:
        update-types:
          - "minor"
        labels:
          - "dependencies"
      opencontext-patch:
        update-types:
          - "patch"
        labels:
          - "dependencies"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"